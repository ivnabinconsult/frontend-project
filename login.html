<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CYLLUX HOMES — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="themes.js"></script>
  <script src="mobile-nav.js"></script>
  <style>
    .auth-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    .auth-tab {
      flex: 1; padding: 10px 0; font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
      background: none; border: none; color: var(--text-muted);
      border-bottom: 2px solid transparent; cursor: pointer; transition: all var(--transition);
      margin-bottom: -1px; font-family: inherit;
    }
    .auth-tab.active { color: var(--crimson); border-bottom-color: var(--crimson); }
    .role-toggle { display: flex; gap: 8px; margin-bottom: 20px; }
    .role-btn {
      flex: 1; padding: 10px; text-align: center; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-3); color: var(--text-secondary);
      cursor: pointer; font-size: 13px; font-weight: 600; transition: all var(--transition);
      font-family: inherit;
    }
    .role-btn.active { border-color: var(--crimson); color: var(--crimson); background: var(--crimson-dim); }
    .auth-error {
      display: none; background: rgba(239,68,68,0.12); color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3); border-radius: 8px;
      padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
    }
    .auth-error.show { display: block; }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
  </style>
</head>
<body id="login-page">
  <div class="login-left">
    <div class="login-brand" onclick="window.location.href='index.html'"><div class="logo-mark">CX</div>Cyllux Homes</div>
    <p class="login-tagline">Premium interior design and smart home technology. Sign in to manage orders — or as a seller, your storefront.</p>
  </div>
  <div class="login-right">
    <div class="login-card">

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin-btn" onclick="switchAuthTab('signin')">Sign In</button>
        <button class="auth-tab" id="tab-signup-btn" onclick="switchAuthTab('signup')">Create Account</button>
      </div>

      <div class="auth-error" id="auth-error"></div>

      <!-- SIGN IN -->
      <div class="auth-panel active" id="panel-signin">
        <h2 class="section-title" style="font-size: 26px; margin-bottom: 20px;">Welcome <span class="crimson-slash">back.</span></h2>
        <div class="role-toggle">
          <button class="role-btn active" id="signin-role-buyer" onclick="setSigninRole('buyer')">🛍️ Buyer</button>
          <button class="role-btn" id="signin-role-seller" onclick="setSigninRole('seller')">🏪 Seller</button>
        </div>
        <input class="login-input" id="signin-email" placeholder="Email Address">
        <input class="login-input" id="signin-password" type="password" placeholder="Password">
        <button class="btn-primary login-submit" onclick="handleSignin()">Sign In →</button>
        <div class="login-create" style="text-align: center; margin-top: 24px;">Don't have an account? <a href="#" onclick="switchAuthTab('signup');return false;" style="color: var(--crimson);">Create Account</a></div>
      </div>

      <!-- SIGN UP -->
      <div class="auth-panel" id="panel-signup">
        <h2 class="section-title" style="font-size: 26px; margin-bottom: 20px;">Create your <span class="crimson-slash">account.</span></h2>
        <div class="role-toggle">
          <button class="role-btn active" id="signup-role-buyer" onclick="setSignupRole('buyer')">🛍️ Buyer</button>
          <button class="role-btn" id="signup-role-seller" onclick="setSignupRole('seller')">🏪 Seller</button>
        </div>
        <input class="login-input" id="signup-name" placeholder="Full Name">
        <input class="login-input" id="signup-email" placeholder="Email Address">
        <input class="login-input" id="signup-password" type="password" placeholder="Password">
        <button class="btn-primary login-submit" onclick="handleSignup()">Create Account →</button>
        <div class="login-create" style="text-align: center; margin-top: 24px;">Already have an account? <a href="#" onclick="switchAuthTab('signin');return false;" style="color: var(--crimson);">Sign In</a></div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"><div id="toast-msg"></div></div>

  <script src="cart.js"></script>
  <script src="auth.js"></script>

  <script>
    let signinRole = 'buyer';
    let signupRole = 'buyer';

    function getNextParam() {
      const params = new URLSearchParams(window.location.search);
      return params.get('next');
    }

    function showAuthError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.add('show');
    }
    function clearAuthError() {
      document.getElementById('auth-error').classList.remove('show');
    }

    function switchAuthTab(tab) {
      clearAuthError();
      document.getElementById('tab-signin-btn').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup-btn').classList.toggle('active', tab === 'signup');
      document.getElementById('panel-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
    }

    function setSigninRole(role) {
      signinRole = role;
      document.getElementById('signin-role-buyer').classList.toggle('active', role === 'buyer');
      document.getElementById('signin-role-seller').classList.toggle('active', role === 'seller');
    }
    function setSignupRole(role) {
      signupRole = role;
      document.getElementById('signup-role-buyer').classList.toggle('active', role === 'buyer');
      document.getElementById('signup-role-seller').classList.toggle('active', role === 'seller');
    }

    function redirectAfterAuth(role) {
      const next = getNextParam();
      if (next) { window.location.href = next; return; }
      window.location.href = role === 'seller' ? 'seller-dashboard.html' : 'index.html';
    }

    function handleSignin() {
      clearAuthError();
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const result = login(email, password, signinRole);
      if (!result.ok) { showAuthError(result.error); return; }
      showToast(`Welcome back, ${result.user.name.split(' ')[0]}!`);
      setTimeout(() => redirectAfterAuth(result.user.role), 700);
    }

    function handleSignup() {
      clearAuthError();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const result = signup(name, email, password, signupRole);
      if (!result.ok) { showAuthError(result.error); return; }
      showToast(`Account created — welcome, ${result.user.name.split(' ')[0]}!`);
      setTimeout(() => redirectAfterAuth(result.user.role), 700);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // If a seller-only page redirected here, default the toggle to Seller
    document.addEventListener('DOMContentLoaded', () => {
      const next = getNextParam();
      if (next && next.includes('seller-dashboard')) {
        setSigninRole('seller');
        setSignupRole('seller');
      }
    });
  </script>
</body>
</html>
